# AutoMQ DYNAMIC-quorum BROKER tier (dedicated brokers, data plane).
#
# The BROKER half of the SEPARATED, SCALABLE topology. Deploy with
# automq-controller-rongyu (controllers) and automq-controller-init-rongyu (seed).
#
# Topology: brokers (process.roles=broker), scale this freely.
#   node.id = 100000 + ordinal  -> 100000 / 100001 / 100002 / ...
#   Brokers are NOT voters. They discover the controller quorum via
#   controller.quorum.bootstrap.servers (the controller + seed MCS Service DNS),
#   so adding a broker never touches the quorum -- the point of separated mode.
#
# Cross-cluster: brokers reach controllers in OTHER clusters via the MCS
# clusterset.local Service DNS (no per-pod ordinal); those Services MUST be
# exported (ServiceExport) on the fleet side.
apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
  labels:
    microsoft-falcon.net/workload-state: stateful
  name: automq-broker-rongyu
  namespace: magnetar-test
spec:
  priorityClassName: prod
  rollbackStrategy:
    minReadyReplicas: 0
    minReadySeconds: 0
    progressDeadlineSeconds: 0
    revisionHistoryLimit: 5
  rolloutStrategy:
    minAvailableReplicas: 100%
  version: '20260624.2'
  workload:
    - manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: automq-broker-rongyu
          namespace: magnetar-test
        spec:
          clusterIP: None
          ports:
            - name: kafka
              port: 9092
              protocol: TCP
              targetPort: kafka
            - name: metrics
              port: 9090
              protocol: TCP
              targetPort: metrics
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          type: ClusterIP
    - manifest:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          labels:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          name: automq-broker-rongyu
          namespace: magnetar-test
        spec:
          replicas: 3
          podManagementPolicy: Parallel
          selector:
            matchLabels:
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          serviceName: automq-broker-rongyu
          template:
            metadata:
              annotations:
                prometheus.io/path: /metrics
                prometheus.io/port: '9090'
                prometheus.io/scrape: 'true'
              labels:
                app.kubernetes.io/component: service
                app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
                azure.workload.identity/use: 'true'
            spec:
              serviceAccountName: falconfleet-magnetar-test-sa
              containers:
                - command:
                    - bash
                    - '-c'
                    - |
                      set -euo pipefail
                      # Per-pod identity: pod automq-broker-rongyu-<N> -> node.id 100000+N
                      ORD="${HOSTNAME##*-}"
                      NODE_ID="$((100000 + ORD))"
                      export KAFKA_CONF_NODE_ID="$NODE_ID"
                      export KAFKA_CONF_ADVERTISED_LISTENERS="PLAINTEXT://$POD_IP:9092"

                      # Render broker.properties from every KAFKA_CONF_* env var
                      # (strip KAFKA_CONF_ prefix, lowercase, '_' -> '.').
                      CONFIG_FILE=/opt/automq/kafka/config/kraft/broker.properties
                      : > "$CONFIG_FILE"
                      for var in ${!KAFKA_CONF_@}; do
                        key=$(printf '%s' "${var#KAFKA_CONF_}" | tr 'A-Z_' 'a-z.')
                        printf '%s=%s\n' "$key" "${!var}" >> "$CONFIG_FILE"
                      done

                      # Table Topic / Schema Registry config (broker-only) appended to
                      # broker.properties. Uses the new HDFS FileIO FQN.
                      printf '%s\n' \
                        'automq.table.topic.catalog.type=rest' \
                        'automq.table.topic.catalog.uri=https://api.magnetar.binginternal.com/unity-catalog/api/2.1/unity-catalog/iceberg' \
                        'automq.table.topic.catalog.warehouse=test_catalog1' \
                        'automq.table.topic.catalog.io-impl=com.automq.hdfs.table.io.WebHdfsFileIO' \
                        'automq.table.topic.catalog.header.subcluster=AKS-NorthEurope-FLEET' \
                        'automq.table.topic.schema.registry.url=https://api.magnetar.binginternal.com/schema-registry' \
                        'automq.table.topic.schema.registry.config.bearer.auth.credentials.source=WORKLOAD_IDENTITY' \
                        'automq.table.topic.schema.registry.config.request.header.subcluster=AKS-NorthEurope-FLEET' \
                        'automq.table.topic.schema.registry.config.auto.register.schemas=false' \
                        >> "$CONFIG_FILE"

                      exec /opt/automq/kafka/bin/kafka-server-start.sh "$CONFIG_FILE"
                  env:
                    - name: KAFKA_CONF_S3_DATA_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/data
                    - name: KAFKA_CONF_S3_OPS_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/data
                    - name: KAFKA_CONF_S3_WAL_PATH
                      value: >-
                        -3@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/wal
                    - name: HDFS_TOKEN_SCOPE
                      value: api://1c0b8c88-563f-4b97-abdf-207172a50d2c/.default
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KAFKA_CONF_PROCESS_ROLES
                      value: broker
                    - name: KAFKA_CONF_LISTENERS
                      value: PLAINTEXT://:9092
                    - name: KAFKA_CONF_INTER_BROKER_LISTENER_NAME
                      value: PLAINTEXT
                    - name: KAFKA_CONF_CONTROLLER_LISTENER_NAMES
                      value: CONTROLLER
                    - name: KAFKA_CONF_CLUSTER_ID
                      value: OB_fAKFJOMYdbIqpoJ6eSQ
                    # Discover the dynamic controller quorum: controller Service AND
                    # the one-shot seed, both via MCS clusterset DNS (cross-cluster).
                    - name: KAFKA_CONF_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS
                      value: automq-controller-rongyu.magnetar-test.svc.clusterset.local:9093,automq-controller-init-rongyu.magnetar-test.svc.clusterset.local:9093
                    - name: KAFKA_CONF_LOG_DIRS
                      value: /tmp/kraft-broker-logs
                    - name: KAFKA_CONF_ELASTICSTREAM_ENABLE
                      value: 'true'
                    - name: KAFKA_CONF_S3_STREAM_ALLOCATOR_POLICY
                      value: POOLED_DIRECT
                    - name: KAFKA_CONF_OFFSETS_TOPIC_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CONF_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CONF_TRANSACTION_STATE_LOG_MIN_ISR
                      value: '2'
                    - name: KAFKA_CONF_METRIC_REPORTERS
                      value: kafka.autobalancer.metricsreporter.AutoBalancerMetricsReporter
                    - name: KAFKA_CONF_S3_TELEMETRY_METRICS_EXPORTER_URI
                      value: prometheus://?host=0.0.0.0&port=9090
                    - name: KAFKA_HEAP_OPTS
                      value: >-
                        -Xms4g -Xmx4g -XX:MetaspaceSize=96m
                        -XX:MaxDirectMemorySize=6G
                    - name: POD__ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                  image: msbingmtcr.azurecr.io/rongyu/automq:test0712sr
                  imagePullPolicy: Always
                  livenessProbe:
                    failureThreshold: 12
                    initialDelaySeconds: 120
                    periodSeconds: 20
                    tcpSocket:
                      port: kafka
                    timeoutSeconds: 10
                  name: automq-broker-rongyu
                  ports:
                    - containerPort: 9092
                      name: kafka
                      protocol: TCP
                    - containerPort: 9090
                      name: metrics
                      protocol: TCP
                  readinessProbe:
                    failureThreshold: 6
                    initialDelaySeconds: 20
                    periodSeconds: 15
                    tcpSocket:
                      port: kafka
                    timeoutSeconds: 5
                  resources:
                    limits:
                      cpu: 4000m
                      memory: 12G
                    requests:
                      cpu: 4000m
                      memory: 12G
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
                microsoft-falcon.net/ap-connectivity: ipv4regional
                microsoft-falcon.net/cloud: azure
                microsoft-falcon.net/cross-region-connectivity: regional
                microsoft-falcon.net/use-case: generic
                scheduler.clusterfleet.io/ready: 'true'
              priorityClassName: prod

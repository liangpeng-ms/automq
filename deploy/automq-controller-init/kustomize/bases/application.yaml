# AutoMQ DYNAMIC-quorum CONTROLLER-INIT (one-shot seed).
#
# Cold-start SEED for a fresh KIP-853 dynamic controller quorum. It formats a
# single-voter (--standalone) quorum with a DEDICATED node.id (100, outside the
# main controllers' 200000+ range), so the real automq-controller-rongyu pods
# can bootstrap and JOIN it via add-controller. Once all controllers are voters,
# remove voter 100 and delete this StatefulSet:
#   kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 \
#     remove-controller --controller-id 100 --controller-directory-id <dir>
#
# Cross-cluster note: controllers/brokers in OTHER clusters reach this seed via
# the MCS clusterset.local Service DNS, so this Service MUST be exported
# (ServiceExport) on the fleet side.
apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
  labels:
    microsoft-falcon.net/workload-state: stateful
  name: automq-controller-init-rongyu
  namespace: magnetar-test
spec:
  priorityClassName: prod
  rollbackStrategy:
    minReadyReplicas: 0
    minReadySeconds: 0
    progressDeadlineSeconds: 0
    revisionHistoryLimit: 5
  rolloutStrategy:
    minAvailableReplicas: 100%
  version: '20260624.2'
  workload:
    - manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: automq-controller-init-rongyu
          namespace: magnetar-test
        spec:
          clusterIP: None
          ports:
            - name: controller
              port: 9093
              protocol: TCP
              targetPort: controller
            - name: metrics
              port: 9090
              protocol: TCP
              targetPort: metrics
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          type: ClusterIP
    - manifest:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          labels:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          name: automq-controller-init-rongyu
          namespace: magnetar-test
        spec:
          replicas: 1
          podManagementPolicy: Parallel
          selector:
            matchLabels:
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          serviceName: automq-controller-init-rongyu
          template:
            metadata:
              annotations:
                prometheus.io/path: /metrics
                prometheus.io/port: '9090'
                prometheus.io/scrape: 'true'
              labels:
                app.kubernetes.io/component: service
                app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
                azure.workload.identity/use: 'true'
            spec:
              serviceAccountName: falconfleet-magnetar-test-sa
              containers:
                - command:
                    - bash
                    - '-c'
                    - >
                      set -euo pipefail


                      # Dedicated seed node.id, outside the real controllers'
                      200000+ range.

                      export KAFKA_CONF_NODE_ID="100"

                      export KAFKA_CONF_ADVERTISED_LISTENERS="CONTROLLER://$POD_IP:9093"


                      # Render controller.properties from every KAFKA_CONF_* env
                      var (strip KAFKA_CONF_ prefix, lowercase, '_' -> '.').

                      CONFIG_FILE=/opt/automq/kafka/config/kraft/controller.properties

                      : > "$CONFIG_FILE"

                      for var in ${!KAFKA_CONF_@}; do
                        key=$(printf '%s' "${var#KAFKA_CONF_}" | tr 'A-Z_' 'a-z.')
                        printf '%s=%s\n' "$key" "${!var}" >> "$CONFIG_FILE"
                      done


                      # Seed a brand-new single-voter dynamic quorum.

                      /opt/automq/kafka/bin/kafka-storage.sh format
                      -t "$KAFKA_CONF_CLUSTER_ID" -c "$CONFIG_FILE" --standalone


                      exec /opt/automq/kafka/bin/kafka-server-start.sh "$CONFIG_FILE"
                  env:
                    - name: KAFKA_CONF_S3_DATA_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/data
                    - name: KAFKA_CONF_S3_OPS_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/data
                    - name: KAFKA_CONF_S3_WAL_PATH
                      value: >-
                        -3@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/pelian/test/falcon/wal
                    - name: HDFS_TOKEN_SCOPE
                      value: api://1c0b8c88-563f-4b97-abdf-207172a50d2c/.default
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KAFKA_CONF_PROCESS_ROLES
                      value: controller
                    - name: KAFKA_CONF_LISTENERS
                      value: CONTROLLER://:9093
                    - name: KAFKA_CONF_CONTROLLER_LISTENER_NAMES
                      value: CONTROLLER
                    - name: KAFKA_CONF_CLUSTER_ID
                      value: OB_fAKFJOMYdbIqpoJ6eSQ
                    # A standalone seed IS the quorum; bootstrap points at itself
                    # (MCS clusterset DNS so cross-cluster controllers can reach it).
                    - name: KAFKA_CONF_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS
                      value: automq-controller-init-rongyu.magnetar-test.svc.clusterset.local:9093
                    - name: KAFKA_CONF_LOG_DIRS
                      value: /tmp/kraft-controller-logs
                    - name: KAFKA_CONF_ELASTICSTREAM_ENABLE
                      value: 'true'
                    - name: KAFKA_CONF_S3_STREAM_ALLOCATOR_POLICY
                      value: POOLED_DIRECT
                    - name: KAFKA_CONF_S3_TELEMETRY_METRICS_EXPORTER_URI
                      value: prometheus://?host=0.0.0.0&port=9090
                    - name: KAFKA_HEAP_OPTS
                      value: >-
                        -Xms1g -Xmx2g -XX:MetaspaceSize=96m
                    - name: POD__ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                  image: msbingmtcr.azurecr.io/rongyu/automq:test0712sr
                  imagePullPolicy: Always
                  livenessProbe:
                    failureThreshold: 12
                    initialDelaySeconds: 120
                    periodSeconds: 20
                    tcpSocket:
                      port: controller
                    timeoutSeconds: 10
                  name: automq-controller-init-rongyu
                  ports:
                    - containerPort: 9093
                      name: controller
                      protocol: TCP
                    - containerPort: 9090
                      name: metrics
                      protocol: TCP
                  readinessProbe:
                    failureThreshold: 6
                    initialDelaySeconds: 20
                    periodSeconds: 15
                    tcpSocket:
                      port: controller
                    timeoutSeconds: 5
                  resources:
                    limits:
                      cpu: 2000m
                      memory: 6G
                    requests:
                      cpu: 2000m
                      memory: 6G
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
                microsoft-falcon.net/ap-connectivity: ipv4regional
                microsoft-falcon.net/cloud: azure
                microsoft-falcon.net/cross-region-connectivity: regional
                microsoft-falcon.net/use-case: generic
                scheduler.clusterfleet.io/ready: 'true'
              priorityClassName: prod

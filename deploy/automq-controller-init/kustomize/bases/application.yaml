# AutoMQ DYNAMIC-quorum CONTROLLER SEED (one-shot cold-start seed).
#
# Seeds a brand-new KIP-853 dynamic (reconfigurable) quorum, so the real
# automq-controller-rongyu members can bootstrap and JOIN it. It formats a
# single-voter quorum with `kafka-storage.sh format --standalone` using a
# dedicated node.id (100, outside the members' 0..N ordinal range) and points
# controller.quorum.bootstrap.servers at ITSELF.
#
# Lifecycle (run ONCE per fresh cluster.id):
#   1. Deploy this seed FIRST (1 voter quorum comes up).
#   2. Deploy automq-controller-rongyu (members format --no-initial-controllers
#      and self-promote via add-controller until they are voters).
#   3. Once the members (0..N) are all voters, retire the seed:
#        kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 \
#          remove-controller --controller-id 100 --controller-directory-id <dir>
#      then delete this Application. (Find <dir> in `describe --status`
#      CurrentVoters for id 100.)
#
# NOTE: this entrypoint BYPASSES /opt/automq/scripts/start.sh on purpose --
# start.sh hardcodes a STATIC `kafka-storage.sh format -g` (voters baked in) and
# has no route to --standalone. We render properties from KAFKA_CFG_* ourselves
# and drive kafka-storage.sh / kafka-server-start.sh directly (same approach as
# the automq-controller-rongyu members).
#
# IMPORTANT: requires a KIP-853 image (kafka-storage.sh --standalone /
# --no-initial-controllers, kafka-metadata-quorum.sh add/remove-controller).
# The pinned tag test0712sr already ships these (verified), so no rebuild needed.
apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
  labels:
    microsoft-falcon.net/workload-state: stateful
  name: automq-controller-init-rongyu
  namespace: magnetar-test
spec:
  priorityClassName: prod
  rollbackStrategy:
    minReadyReplicas: 0
    minReadySeconds: 0
    progressDeadlineSeconds: 0
    revisionHistoryLimit: 5
  rolloutStrategy:
    minAvailableReplicas: 100%
  version: '20260624.2'
  workload:
    - manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: automq-controller-init-rongyu
          namespace: magnetar-test
        spec:
          clusterIP: None
          ports:
            - name: controller
              port: 9093
              protocol: TCP
              targetPort: controller
            - name: metrics
              port: 9090
              protocol: TCP
              targetPort: metrics
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          type: ClusterIP
    - manifest:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          labels:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          name: automq-controller-init-rongyu
          namespace: magnetar-test
        spec:
          replicas: 1
          podManagementPolicy: Parallel
          selector:
            matchLabels:
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
          serviceName: automq-controller-init-rongyu
          template:
            metadata:
              annotations:
                prometheus.io/path: /metrics
                prometheus.io/port: '9090'
                prometheus.io/scrape: 'true'
              labels:
                app.kubernetes.io/component: service
                app.kubernetes.io/instance: magnetar-test.automq-controller-init-rongyu
                azure.workload.identity/use: 'true'
            spec:
              serviceAccountName: falconfleet-magnetar-test-sa
              containers:
                - command:
                    - bash
                    - '-c'
                    - >
                      set -euo pipefail


                      # Dedicated seed node.id, outside the members' 0..N ordinal
                      range. advertised.listeners MUST be the routable Pod IP so
                      cross-cluster members can reach this voter directly (per-pod
                      cluster.local DNS is NOT exported across clusters).

                      export KAFKA_CFG_NODE_ID="100"

                      export KAFKA_CFG_ADVERTISED_LISTENERS="CONTROLLER://$POD_IP:9093"


                      # Render controller.properties from every KAFKA_CFG_* env
                      # var (drop KAFKA_CFG_ prefix, lowercase, '_' -> '.').

                      CONFIG_FILE=/opt/automq/kafka/config/kraft/controller.properties

                      : > "$CONFIG_FILE"

                      for var in ${!KAFKA_CFG_@}; do
                        key=$(printf '%s' "${var#KAFKA_CFG_}" | tr 'A-Z_' 'a-z.')
                        printf '%s=%s\n' "$key" "${!var}" >> "$CONFIG_FILE"
                      done


                      BIN=/opt/automq/kafka/bin

                      LOG_DIR="${KAFKA_CFG_LOG_DIRS}"


                      # Seed a brand-new single-voter dynamic quorum only once.

                      if [ ! -f "$LOG_DIR/meta.properties" ]; then
                        echo "[seed] node 100: formatting single-voter dynamic quorum (--standalone)"
                        KAFKA_HEAP_OPTS="-Xmx128m -Xms64m" "$BIN/kafka-storage.sh" \
                          format -t "$KAFKA_CFG_CLUSTER_ID" -c "$CONFIG_FILE" --standalone
                      else
                        echo "[seed] node 100: storage already formatted, starting (rejoin)"
                      fi


                      exec "$BIN/kafka-server-start.sh" "$CONFIG_FILE"
                  env:
                    - name: KAFKA_CFG_PROCESS_ROLES
                      value: controller
                    - name: KAFKA_CFG_LISTENERS
                      value: CONTROLLER://:9093
                    - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
                      value: CONTROLLER
                    # A standalone seed IS the quorum; bootstrap points at itself.
                    - name: KAFKA_CFG_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS
                      value: >-
                        automq-controller-init-rongyu.magnetar-test.svc.clusterset.local:9093
                    - name: KAFKA_CFG_CLUSTER_ID
                      value: OB_fAKFJOMYdbIqpoJ6eSQ
                    # Cluster-wide defaults the controller applies when auto-creating
                    # internal topics (__consumer_offsets, __transaction_state). Match
                    # the broker tier (3 brokers) so the internal topics get HA copies.
                    - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
                      value: '2'
                    - name: KAFKA_CFG_S3_DATA_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/data
                    - name: KAFKA_CFG_S3_OPS_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/data
                    - name: KAFKA_CFG_S3_WAL_PATH
                      value: >-
                        -3@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/wal
                    - name: HDFS_TOKEN_SCOPE
                      value: api://1c0b8c88-563f-4b97-abdf-207172a50d2c/.default
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KAFKA_CFG_LOG_DIRS
                      value: /tmp/kraft-controller-logs
                    - name: KAFKA_CFG_ELASTICSTREAM_ENABLE
                      value: 'true'
                    - name: KAFKA_CFG_S3_STREAM_ALLOCATOR_POLICY
                      value: POOLED_DIRECT
                    - name: KAFKA_CFG_S3_TELEMETRY_METRICS_EXPORTER_URI
                      value: prometheus://?host=0.0.0.0&port=9090
                    - name: KAFKA_HEAP_OPTS
                      value: >-
                        -Xms1g -Xmx2g -XX:MetaspaceSize=96m
                    - name: POD__ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                  image: msbingmtcr.azurecr.io/rongyu/automq:test0712sr
                  imagePullPolicy: Always
                  livenessProbe:
                    failureThreshold: 12
                    initialDelaySeconds: 120
                    periodSeconds: 20
                    tcpSocket:
                      port: controller
                    timeoutSeconds: 10
                  name: automq-controller-init-rongyu
                  ports:
                    - containerPort: 9093
                      name: controller
                      protocol: TCP
                    - containerPort: 9090
                      name: metrics
                      protocol: TCP
                  readinessProbe:
                    failureThreshold: 6
                    initialDelaySeconds: 20
                    periodSeconds: 15
                    tcpSocket:
                      port: controller
                    timeoutSeconds: 5
                  resources:
                    limits:
                      cpu: 2000m
                      memory: 6G
                    requests:
                      cpu: 2000m
                      memory: 6G
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
                microsoft-falcon.net/ap-connectivity: ipv4regional
                microsoft-falcon.net/cloud: azure
                microsoft-falcon.net/cross-region-connectivity: regional
                microsoft-falcon.net/use-case: generic
                scheduler.clusterfleet.io/ready: 'true'
              priorityClassName: prod

# AutoMQ STATIC-quorum BROKER tier -- DEBUG variant.
#
# IDENTICAL to deploy/automq-broker's application.yaml EXCEPT the container
# command does NOT 'exec' start.sh: it runs start.sh, captures the exit code,
# prints it, then holds the container Running with 'sleep infinity'. This keeps
# a crashed broker pod alive so server.log can be read via `kubectl exec`
# (a crash-looping pod can't be exec'd into). Use ONLY for debugging a startup
# crash, never in production.
#
# This is a SEPARATE deploy tree (deploy/automq-broker-debug) with the SAME
# Application name/namespace as deploy/automq-broker, so applying it REPLACES the
# normal broker workload with the debug one. Deploy with:
#   kubectl apply -k deploy/automq-broker-debug/kustomize/magnetar-test
# and switch back with:
#   kubectl apply -k deploy/automq-broker/kustomize/magnetar-test
apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
  labels:
    microsoft-falcon.net/workload-state: stateful
  name: automq-broker-rongyu
  namespace: magnetar-test
spec:
  priorityClassName: prod
  rollbackStrategy:
    minReadyReplicas: 0
    minReadySeconds: 0
    progressDeadlineSeconds: 0
    revisionHistoryLimit: 5
  rolloutStrategy:
    minAvailableReplicas: 100%
  version: '20260624.2'
  workload:
    - manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: automq-broker-rongyu
          namespace: magnetar-test
        spec:
          clusterIP: None
          ports:
            - name: kafka
              port: 9092
              protocol: TCP
              targetPort: kafka
            - name: metrics
              port: 9090
              protocol: TCP
              targetPort: metrics
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          type: ClusterIP
    - manifest:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          labels:
            app.kubernetes.io/component: service
            app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          name: automq-broker-rongyu
          namespace: magnetar-test
        spec:
          replicas: 3
          podManagementPolicy: Parallel
          selector:
            matchLabels:
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
          serviceName: automq-broker-rongyu
          template:
            metadata:
              annotations:
                prometheus.io/path: /metrics
                prometheus.io/port: '9090'
                prometheus.io/scrape: 'true'
              labels:
                app.kubernetes.io/component: service
                app.kubernetes.io/instance: magnetar-test.automq-broker-rongyu
                azure.workload.identity/use: 'true'
            spec:
              serviceAccountName: falconfleet-magnetar-test-sa
              containers:
                - command:
                    - bash
                    - '-c'
                    - >
                      set -euo pipefail


                      # Per-pod identity from the StatefulSet ordinal
                      (HOSTNAME = automq-broker-rongyu-<N>). node.id = 100000+ordinal,
                      kept out of the controllers' 0..N and the seed's 100 range.
                      Brokers are NOT voters -- they only DISCOVER the quorum via
                      controller.quorum.bootstrap.servers (a DYNAMIC quorum has no
                      fixed voter roster to hardcode).

                      ORD="${HOSTNAME##*-}"

                      export KAFKA_CFG_NODE_ID="$((100000 + ORD))"

                      export KAFKA_CFG_ADVERTISED_LISTENERS="PLAINTEXT://$POD_IP:9092"


                      # Render broker.properties from every KAFKA_CFG_* env var
                      # (drop KAFKA_CFG_ prefix, lowercase, '_' -> '.').

                      CONFIG_FILE=/opt/automq/kafka/config/kraft/broker.properties

                      : > "$CONFIG_FILE"

                      for var in ${!KAFKA_CFG_@}; do
                        key=$(printf '%s' "${var#KAFKA_CFG_}" | tr 'A-Z_' 'a-z.')
                        printf '%s=%s\n' "$key" "${!var}" >> "$CONFIG_FILE"
                      done


                      # Table Topic catalog / Schema Registry config. Appended
                      directly (NOT via KAFKA_CFG_*) because keys contain '-'
                      (e.g. catalog.io-impl) which the env-var name mangling cannot
                      express. Uses the HDFS FileIO FQN.

                      printf '%s\n' 'automq.table.topic.catalog.type=rest' 'automq.table.topic.catalog.uri=https://api.magnetar.binginternal.com/unity-catalog/api/2.1/unity-catalog/iceberg' 'automq.table.topic.catalog.warehouse=test_catalog1' 'automq.table.topic.catalog.io-impl=com.automq.hdfs.table.io.WebHdfsFileIO' 'automq.table.topic.catalog.header.subcluster=AKS-NorthEurope-FLEET' 'automq.table.topic.schema.registry.url=https://api.magnetar.binginternal.com/schema-registry' 'automq.table.topic.schema.registry.config.bearer.auth.credentials.source=WORKLOAD_IDENTITY' 'automq.table.topic.schema.registry.config.credential.provider.scope=api://1c0b8c88-563f-4b97-abdf-207172a50d2c/.default' 'automq.table.topic.schema.registry.config.request.header.subcluster=AKS-NorthEurope-FLEET' 'automq.table.topic.schema.registry.config.auto.register.schemas=false' >> "$CONFIG_FILE"


                      # A broker on unformatted storage auto-formats its metadata
                      directory on startup (AutoMQ behavior), so no explicit
                      kafka-storage.sh format step is needed here.

                      # DEBUG: no 'exec' so the shell survives a broker crash; on
                      # exit we print the code and hold the container Running
                      # (sleep infinity) so server.log can be read via kubectl exec.
                      # Swap back to automq-broker (exec ...) once fixed.

                      RC=0

                      /opt/automq/kafka/bin/kafka-server-start.sh "$CONFIG_FILE" || RC=$?

                      echo "=== kafka-server-start exited with code $RC ; holding container for debug (sleep infinity) ==="

                      sleep infinity
                  env:
                    - name: KAFKA_CFG_PROCESS_ROLES
                      value: broker
                    - name: KAFKA_CFG_LISTENERS
                      value: PLAINTEXT://:9092
                    - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
                      value: PLAINTEXT
                    - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
                      value: CONTROLLER
                    - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
                      value: >-
                        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
                    # Discover the DYNAMIC controller quorum via its MCS address
                    # (a dynamic quorum has no fixed voter roster to hardcode).
                    - name: KAFKA_CFG_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS
                      value: >-
                        automq-controller-rongyu.magnetar-test.svc.clusterset.local:9093
                    - name: KAFKA_CFG_CLUSTER_ID
                      value: OB_fAKFJOMYdbIqpoJ6eSQ
                    # Broker-side continuous self-balancing (start.sh used to inject
                    # this; we render properties ourselves now, so set it explicitly).
                    - name: KAFKA_CFG_METRIC_REPORTERS
                      value: kafka.autobalancer.metricsreporter.AutoBalancerMetricsReporter
                    - name: KAFKA_CFG_S3_DATA_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/data
                    - name: KAFKA_CFG_S3_OPS_BUCKETS
                      value: >-
                        0@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/data
                    - name: KAFKA_CFG_S3_WAL_PATH
                      value: >-
                        -3@hdfs://automq?endpoint=https://hdfs-http-ipv4-mtprime-dube01-0.magnetar.binginternal.com:83/webhdfs/v1/MTPrime-DUBE01-0/user/rongyu/test/falcon/wal
                    - name: HDFS_TOKEN_SCOPE
                      value: api://1c0b8c88-563f-4b97-abdf-207172a50d2c/.default
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: KAFKA_CFG_LOG_DIRS
                      value: /tmp/kraft-broker-logs
                    - name: KAFKA_CFG_ELASTICSTREAM_ENABLE
                      value: 'true'
                    - name: KAFKA_CFG_S3_STREAM_ALLOCATOR_POLICY
                      value: POOLED_DIRECT
                    - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
                      value: '3'
                    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
                      value: '2'
                    - name: KAFKA_CFG_S3_TELEMETRY_METRICS_EXPORTER_URI
                      value: prometheus://?host=0.0.0.0&port=9090
                    - name: KAFKA_HEAP_OPTS
                      value: >-
                        -Xms4g -Xmx4g -XX:MetaspaceSize=96m
                        -XX:MaxDirectMemorySize=6G
                    - name: POD__ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                  image: msbingmtcr.azurecr.io/rongyu/automq:test0712sr
                  imagePullPolicy: Always
                  livenessProbe:
                    failureThreshold: 12
                    initialDelaySeconds: 120
                    periodSeconds: 20
                    tcpSocket:
                      port: kafka
                    timeoutSeconds: 10
                  name: automq-broker-rongyu
                  ports:
                    - containerPort: 9092
                      name: kafka
                      protocol: TCP
                    - containerPort: 9090
                      name: metrics
                      protocol: TCP
                  readinessProbe:
                    failureThreshold: 6
                    initialDelaySeconds: 20
                    periodSeconds: 15
                    tcpSocket:
                      port: kafka
                    timeoutSeconds: 5
                  resources:
                    limits:
                      cpu: 4000m
                      memory: 12G
                    requests:
                      cpu: 4000m
                      memory: 12G
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
                microsoft-falcon.net/ap-connectivity: ipv4regional
                microsoft-falcon.net/cloud: azure
                microsoft-falcon.net/cross-region-connectivity: regional
                microsoft-falcon.net/use-case: generic
                scheduler.clusterfleet.io/ready: 'true'
              priorityClassName: prod
